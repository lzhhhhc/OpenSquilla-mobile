plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'com.chaquo.python'
}

android {
    namespace 'ai.opensquilla.app'
    compileSdk 35

    defaultConfig {
        applicationId 'ai.opensquilla.app'
        minSdk 26
        targetSdk 35
        def buildVc = (System.currentTimeMillis() / 1000L) as int
        versionCode buildVc
        versionName '0.5.8'

        ndk { abiFilters 'arm64-v8a' }

        python {
            version '3.12'
            buildPython 'python3'
            // OpenSquilla accesses bundled data (migrations, WebUI dist, router
            // bundle) via real filesystem paths; the virtual AssetFinder breaks
            // Path.exists(), so extract the whole package to disk.
            extractPackages 'opensquilla'
        }
    }

    chaquopy {
        defaultConfig {
            pip {
                // ── Synced with upstream opensquilla v0.5.8 pyproject floors ──
                // Core runtime
                install 'starlette>=1.6.0'
                install 'python-multipart>=0.0.32'
                install 'uvicorn>=0.30'
                // pydantic is pinned to the last release whose Rust core has an
                // Android arm64-v8a wheel vendored in ./wheels (pydantic_core
                // 2.41.5). Upstream floor is >=2.13.5; bump both together.
                // Verified 2026-11-25: the v0.5.8 gateway boots and serves on 2.12.5.
                install 'pydantic==2.12.5'
                install rootProject.file('wheels/pydantic_core-2.41.5-cp312-cp312-android_24_arm64_v8a.whl').absolutePath
                install 'pydantic-settings>=2.15.0'
                install 'sqlmodel>=0.0.42'
                install 'sqlalchemy>=2.0.52'
                install 'greenlet'                   // SQLAlchemy async engine (Chaquopy prebuilt)
                install 'anyio>=4.15.1'
                install 'httpx>=0.27'
                install 'jinja2>=3.1'
                install 'structlog>=26.1.0'
                install 'typer>=0.27.2,<0.28'
                install 'click>=8.5.0,<9'
                install 'rich>=13.0'
                install 'websockets>=16.0,<18'
                install 'aiosqlite>=0.20'
                install 'apscheduler>=3.11.3'
                install 'pyyaml>=6.0'
                install 'cachetools>=5.3'
                install 'certifi>=2026.10.19'
                install 'croniter>=6.2.4'
                install 'tomli-w>=1.0'
                install 'yoyo-migrations>=8.2,<10'
                install 'sqlparse>=0.6.0'
                install 'questionary>=2.1'
                // MCP-native tools: the whole stack is pure Python.
                install 'mcp>=2.2.0,<3'
                // Native deps with Chaquopy prebuilt wheels. Floors relaxed
                // versus upstream: Chaquopy ships pillow 11.0.0, cryptography
                // 42.0.8, lxml 5.3.0, pyyaml 6.0.3, greenlet 3.0.1 for cp312 arm64-v8a.
                install 'pillow>=10.0'
                install 'cryptography>=42'
                install 'lxml>=5.0'
                install 'markupsafe>=2.1'
                // Parsing / attachments
                install 'beautifulsoup4>=4.15.0'
                install 'soupsieve>=2.9.2'
                install 'html2text>=2024.2'
                install 'readability-lxml>=0.9'
                install 'lxml-html-clean>=0.4.5'
                install 'pypdf>=6.21.4'
                install 'python-docx>=1.1.0'
                install 'python-pptx>=1.0.0'
                install 'openpyxl>=3.1.0'
                install 'reportlab>=4.0.0'
                // Text normalisation used by memory search
                install 'anyascii>=0.3.3'
                install 'snowballstemmer>=2.2'
                // Pure-python channel SDKs (qq-botpy needs aiohttp: skipped).
                install 'python-telegram-bot>=22.8'
                install 'lark-oapi>=1.5.5,<1.6'
                install 'dingtalk-stream>=0.24.3,<0.25'
                // ── Upstream v0.5.8 deps with no Android wheel: skipped ──
                //   aiohttp/multidict/yarl  -> discord.py, qq-botpy (lazy imports)
                //   pdfplumber + pypdfium2  -> PDF tables (pypdf text path works)
                //   sqlite-vec              -> vector memory (keyword path works)
                //   duckduckgo-search       -> needs `primp` (Rust binary)
                //   watchfiles/httptools/uvloop -> uvicorn[standard] extras
                //   tokenizers/onnxruntime/lightgbm -> ML router (stubbed, see
                //       squilla_router notes in README)
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
}